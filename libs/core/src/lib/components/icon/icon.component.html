<ion-icon
  [slot]="this.slot()"
  class="icon"
  [@rotateAnim]="state()"
  (@rotateAnim.done)="rotateAnimDone($event)"
  [name]="this.name()"
  [color]="color"
></ion-icon>
@if (this.dot()) {
  <span [@scaleAnim]="this.indicatorState()" class="indicator-dot"></span>
}
@if (this.off) {
  <span class="off-background"></span>
  <span class="off"></span>
}
@if (this.smallIcon() && this.badge()) {
  <span class="indicator-small-icon">
    <ion-icon
      [color]="color"
      slot="icon-only"
      [name]="this.smallIcon()"
    ></ion-icon>
  </span>
}
@if (this.badge() && this.badge() > 0 && !this.dot()) {
  <span
    [@scaleAnim]="this.badgeState()"
    (@scaleAnim.done)="incrementDone($event)"
    class="indicator-badge"
  >
    @if (this.badge() <= 9) {
      <span>{{ this.badge() }}</span>
    }
    @if (this.badge() > 9) {
      <span>9+</span>
    }
  </span>
}
